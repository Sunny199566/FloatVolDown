name: Build Tweak
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout 你的项目源码
        uses: actions/checkout@v4

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout SDKs
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos/sdks

      - name: 配置环境变量
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV

      - name: 编译 rootless deb
        run: |
          make clean package FINALPACKAGE=1

      - name: 上传deb
        uses: actions/upload-artifact@v4
        with:
          name: FloatVolDown-deb
          path: packages/*.deb
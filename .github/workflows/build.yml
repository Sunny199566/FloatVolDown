name: Build FloatVolDown TrollStore IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Main Swift App
        run: |
          xcodebuild archive \
          -project FloatVolDown.xcodeproj \
          -scheme FloatVolDown \
          -sdk iphoneos \
          -configuration Release \
          -archivePath ./FloatVolDown.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

      - name: Prepare entitlements
        run: |
          cat > entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>get-task-allow</key>
          	<true/>
          </dict>
          </plist>
          EOF

      - name: Install ldid
        run: |
          brew install ldid

      - name: Inject entitlements
        run: |
          ls -la ./FloatVolDown.xcarchive/Products/Applications/FloatVolDown.app/
          ldid -S"entitlements.plist" ./FloatVolDown.xcarchive/Products/Applications/FloatVolDown.app/FloatVolDown

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ./FloatVolDown.xcarchive/Products/Applications/FloatVolDown.app Payload/
          zip -r FloatVolDown.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FloatVolDown-TrollStore
          path: FloatVolDown.ipa
name: Build Tweak

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Install ldid via homebrew
        run: brew install ldid

      - name: Clone full Theos (with submodules)
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Env
        run: echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV

      - name: Build
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-file
          path: packages/*.deb
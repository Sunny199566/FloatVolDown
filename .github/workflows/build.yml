name: Build FloatVolDown (TrollStore unsigned IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Archive
        run: |
          xcodebuild archive \
            -project FloatVolDown.xcodeproj \
            -scheme FloatVolDown \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./FloatVolDown.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual

      - name: Manually package unsigned IPA
        run: |
          # 创建IPA打包目录结构
          mkdir -p Payload
          # 从xcarchive复制app
          cp -r ./FloatVolDown.xcarchive/Products/Applications/FloatVolDown.app ./Payload/
          # 压缩成ipa，无签名
          zip -q -r FloatVolDown.ipa Payload
          # 移动到out目录，方便上传
          mkdir -p out
          mv FloatVolDown.ipa out/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatVolDown-Unsigned
          path: out/*.ipa
          retention-days: 7
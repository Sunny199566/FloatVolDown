name: Build Tweak

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: theos/setup-theos@v1
        with:
          sdk: latest

      - name: Build & package
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-file
          path: packages/*.deb
name: Build FloatVolDown (TrollStore unsigned IPA)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Archive
        run: |
          xcodebuild archive \
            -project FloatVolDown.xcodeproj \
            -scheme FloatVolDown \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./FloatVolDown.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual

      - name: Export unsigned IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath ./FloatVolDown.xcarchive \
            -exportOptionsPlist ./exportOptions.plist \
            -exportPath ./out

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FloatVolDown-Troll
          path: ./out/*.ipa